<body></body>
<script src="https://cdn.jsdelivr.net/gh/netizenorg/netnet-standard-library@1.0.1/build/nn.min.js"></script>
<script>
  let base = 'https://storage.googleapis.com/cdn.patatap.com/A/'
  let you = true

  // your JavaScript code here  
  // this is how i change my <body>
  nn.get('body')
    .css('background', 'brown')
    .css('margin', 0)

  let clay = nn.create('audio')
    .addTo('body')
    .set('controls', you)
    .set('src', base + "clay.mp3")
  
  let moon = nn.create('audio')
    .addTo('body')
    .set('controls', you)
    .set('src', base + "moon.mp3")

  clay.rotate(3)

  function play (e) {
    if (e.key === "q") {
      clay.currentTime = 0
      //when we're doing timing with numbers in code we usually think of miliseconds
      clay.play()
    }
    if (e.key === "w") {
      moon.currentTime = 0
      moon.play()
    }
  }
  nn.on("keydown", play)
  //event string names are one of the rare cases where we dont use camel casing
</script>
